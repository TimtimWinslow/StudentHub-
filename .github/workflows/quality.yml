name: StudentHub quality checks

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Syntax and release smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check debug.js
          node --check sw.js
      - name: Run release smoke tests
        run: node --test tests/release-smoke.test.js
