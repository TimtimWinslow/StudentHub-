<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentHub</title>

  <meta name="theme-color" content="#071A2B" />
  <meta name="description" content="Your CNA class. Your progress. Your community." />
  <link rel="icon" type="image/svg+xml" href="assets/studenthub-favicon.svg" />
  <link rel="apple-touch-icon" href="assets/studenthub-mark.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudentHub" />

  <link rel="stylesheet" href="style.css" />

  <script>
    window.STUDENTHUB_DEBUG = {
      enabled: new URLSearchParams(window.location.search).get("debug") === "true",
      startedAt: new Date().toISOString(),
      errors: []
    };

    window.addEventListener("error", function (event) {
      window.STUDENTHUB_DEBUG.errors.push({
        type: "JavaScript Error",
        message: event.message || "Unknown JavaScript error",
        source: event.filename || "Unknown source",
        line: event.lineno || "Unknown line",
        column: event.colno || "Unknown column"
      });
    });

    window.addEventListener("unhandledrejection", function (event) {
      window.STUDENTHUB_DEBUG.errors.push({
        type: "Unhandled Promise Error",
        message: event.reason?.message || String(event.reason) || "Unknown promise error"
      });
    });

    document.documentElement.setAttribute("data-studenthub-index-loaded", "true");
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        let refreshing = false;

        const showUpdatePrompt = (registration) => {
          if (document.getElementById("studenthub-update-prompt")) return;

          const prompt = document.createElement("div");
          prompt.id = "studenthub-update-prompt";
          prompt.className = "pwa-update-prompt";
          prompt.innerHTML = `
            <span>StudentHub has an update ready.</span>
            <button type="button" id="studenthub-update-button">Update</button>
          `;
          document.body.appendChild(prompt);

          document.getElementById("studenthub-update-button")?.addEventListener("click", () => {
            prompt.remove();
            registration.waiting?.postMessage({ type: "SKIP_WAITING" });
          });
        };

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });

        navigator.serviceWorker.register("./sw.js", { scope: "./" }).then((registration) => {
          registration.update();

          const checkForWaitingWorker = () => {
            if (registration.waiting && navigator.serviceWorker.controller) {
              showUpdatePrompt(registration);
            }
          };

          checkForWaitingWorker();

          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            if (!worker) return;

            worker.addEventListener("statechange", () => {
              if (worker.state === "installed") checkForWaitingWorker();
            });
          });
        }).catch((error) => {
          console.warn("StudentHub service worker registration failed:", error);
        });

        const updateOfflineStatus = () => {
          let banner = document.getElementById("studenthub-offline-status");

          if (!banner) {
            banner = document.createElement("div");
            banner.id = "studenthub-offline-status";
            banner.className = "offline-status";
            document.body.appendChild(banner);
          }

          if (navigator.onLine) {
            banner.classList.remove("visible");
            banner.textContent = "";
          } else {
            banner.textContent = "You're offline — StudentHub will reconnect when you're back online.";
            banner.classList.add("visible");
          }
        };

        window.addEventListener("online", updateOfflineStatus);
        window.addEventListener("offline", updateOfflineStatus);
        updateOfflineStatus();
      });
    }
  </script>
</head>

<body>
  <div id="app">
    <!-- StudentHub will load here -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="debug.js"></script>
  <script src="admin.js"></script>
  <script src="app.js"></script>

  <script>
    (() => {
      let deferredInstallPrompt = null;

      const isStandalone = () =>
        window.matchMedia?.("(display-mode: standalone)")?.matches ||
        window.navigator.standalone === true;

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const isAndroid = /Android/i.test(navigator.userAgent);
      const isInAppBrowser = /FBAN|FBAV|Instagram|Line\//i.test(navigator.userAgent);

      const removeInstallUi = () => {
        document.getElementById("studenthub-install-button")?.remove();
        document.getElementById("studenthub-install-modal")?.remove();
      };

      const showInstallInstructions = (platform) => {
        if (document.getElementById("studenthub-install-modal")) return;

        const android = platform === "android";
        const title = android
          ? "Install StudentHub on Android"
          : "Add StudentHub to your iPhone";

        const steps = android
          ? `
            <li>Open StudentHub in <strong>Chrome</strong>.</li>
            <li>Tap <strong>Install</strong> if Chrome shows the install option, or open the <strong>⋮</strong> menu and choose <strong>Install app</strong> / <strong>Add to Home screen</strong>.</li>
            <li>Tap <strong>Install</strong> or <strong>Add</strong> to finish.</li>
          `
          : `
            <li>Tap the <strong>Share</strong> button in Safari.</li>
            <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
            <li>Tap <strong>Add</strong> to finish.</li>
          `;

        const modal = document.createElement("div");
        modal.id = "studenthub-install-modal";
        modal.className = "pwa-install-modal-backdrop";
        modal.innerHTML = `
          <div class="pwa-install-modal" role="dialog" aria-modal="true" aria-labelledby="pwa-install-title">
            <div class="pwa-install-modal-header">
              <div>
                <span class="pwa-install-kicker">StudentHub App</span>
                <h2 id="pwa-install-title">${title}</h2>
              </div>
              <button type="button" class="pwa-install-close" aria-label="Close">×</button>
            </div>
            <ol class="pwa-install-steps">${steps}</ol>
            <p class="pwa-install-note">StudentHub will open from your Home Screen like an app.</p>
            <button type="button" class="primary-button pwa-install-done">Got it</button>
          </div>
        `;

        document.body.appendChild(modal);

        const close = () => modal.remove();
        modal.querySelector(".pwa-install-close")?.addEventListener("click", close);
        modal.querySelector(".pwa-install-done")?.addEventListener("click", close);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) close();
        });
      };

      const createInstallButton = () => {
        const existing = document.getElementById("studenthub-install-button");
        const slot = document.getElementById("studenthub-install-slot");

        if (isStandalone() || isInAppBrowser) return;

        if (existing) {
          if (slot && existing.parentElement !== slot) {
            slot.appendChild(existing);
          }
          return;
        }

        const button = document.createElement("button");
        button.id = "studenthub-install-button";
        button.type = "button";
        button.className = "pwa-install-button";
        button.innerHTML = `
          <span class="pwa-install-icon">⌂</span>
          <span>
            <strong>Install StudentHub</strong>
            <small>Add StudentHub to your Home Screen</small>
          </span>
        `;

        button.addEventListener("click", async () => {
          if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            const result = await deferredInstallPrompt.userChoice;

            if (result?.outcome === "accepted") {
              removeInstallUi();
            }

            deferredInstallPrompt = null;
            return;
          }

          if (isIOS) {
            showInstallInstructions("ios");
            return;
          }

          if (isAndroid) {
            showInstallInstructions("android");
            return;
          }

          alert("Use your browser's Install or Add to Home Screen option to install StudentHub.");
        });

        const slot = document.getElementById("studenthub-install-slot");

        if (slot) {
          slot.appendChild(button);
        } else {
          document.body.appendChild(button);
        }
      };

      window.addEventListener("studenthub-shell-ready", () => {
        createInstallButton();
      });

      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        createInstallButton();
      });

      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        removeInstallUi();
      });

      window.addEventListener("load", () => {
        if (!isStandalone() && !isInAppBrowser) {
          createInstallButton();
        }
      });

      window.addEventListener("pageshow", () => {
        if (isStandalone()) {
          removeInstallUi();
        }
      });
    })();
  </script>
</body>
</html>
