<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudentHub</title>

  <meta name="theme-color" content="#071A2B" />
  <meta name="description" content="Your CNA class. Your progress. Your community." />
  <link rel="icon" type="image/svg+xml" href="assets/studenthub-favicon.svg" />
  <link rel="apple-touch-icon" href="assets/studenthub-mark.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StudentHub" />

  <link rel="stylesheet" href="style.css" />

  <script>
    window.STUDENTHUB_DEBUG = {
      enabled: new URLSearchParams(window.location.search).get("debug") === "true",
      startedAt: new Date().toISOString(),
      errors: []
    };

    window.addEventListener("error", function (event) {
      window.STUDENTHUB_DEBUG.errors.push({
        type: "JavaScript Error",
        message: event.message || "Unknown JavaScript error",
        source: event.filename || "Unknown source",
        line: event.lineno || "Unknown line",
        column: event.colno || "Unknown column"
      });
    });

    window.addEventListener("unhandledrejection", function (event) {
      window.STUDENTHUB_DEBUG.errors.push({
        type: "Unhandled Promise Error",
        message: event.reason?.message || String(event.reason) || "Unknown promise error"
      });
    });

    document.documentElement.setAttribute("data-studenthub-index-loaded", "true");
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("appinstalled", () => {
        deferredInstallPrompt = null;
        removeInstallUi();
        window.dispatchEvent(new Event("studenthub-app-installed"));
      });

      window.addEventListener("load", () => {
        if (!isStandalone() && !isInAppBrowser) {
          createInstallButton();
        }
      });

      window.addEventListener("pageshow", () => {
        if (isStandalone()) {
          removeInstallUi();
        }
      });
    })();
  </script>
</body>
</html>
